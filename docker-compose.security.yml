services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: claimshield-local
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    ports:
      - "5044:5044"
    volumes:
      - ./observability/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  trivy:
    image: aquasec/trivy:0.56.2
    profiles: ["scan"]
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    command: fs --severity HIGH,CRITICAL .

  dependency-check:
    image: owasp/dependency-check:9.2.0
    profiles: ["scan"]
    volumes:
      - .:/src:ro
      - dependency-check-data:/usr/share/dependency-check/data
    command: --scan /src --format HTML --out /src/security/reports

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["dast"]
    command: zap-baseline.py -t http://host.docker.internal:3000 -c /zap/wrk/zap-baseline.conf
    volumes:
      - ./security/zap:/zap/wrk:rw

volumes:
  dependency-check-data:
