input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "service" => "claimshield" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "claimshield-investigations-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
